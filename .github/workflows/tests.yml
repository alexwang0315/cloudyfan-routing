name: Offline core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
      # Dependency preparation may access package indexes. Model APIs are never
      # used. Warm the separate isolated-build cache before the offline gate.
      - name: Prepare locked test and declared build dependencies
        run: |
          uv sync --locked --extra dev
          uv build --out-dir runtime/ci-build-preparation
      - name: Shared offline integration gate
        run: ./scripts/check --integration
