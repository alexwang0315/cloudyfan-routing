[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cloudyfan-monitor"
version = "0.1.0"
description = "Local operator console for CloudyFan's controlled task service"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "cloudyfan-jev-core==0.1.0"]

[project.scripts]
cloudyfan-monitor = "cloudyfan_monitor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudyfan_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F"]
