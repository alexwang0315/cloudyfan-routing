[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cloudyfan-monitor"
version = "0.1.0"
description = "Local operator console for CloudyFan's controlled task service"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "cloudyfan-mrc==0.1.0"]

[project.optional-dependencies]
simulation = ["ollama==0.6.3"]

[project.scripts]
cloudyfan-monitor = "cloudyfan_monitor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudyfan_monitor"]

# Outside a Git checkout (frozen acceptance snapshots) hatchling does not apply
# .gitignore, so private runtime receipts and caches must be excluded explicitly.
[tool.hatch.build.targets.sdist]
exclude = ["/runtime", "/output", "/dist", "/.venv", "__pycache__", ".pytest_cache", ".ruff_cache", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F"]
