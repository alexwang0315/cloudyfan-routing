[project]
name = "cloudyfami-portal"
version = "0.0.1"
description = "Cloudyfami platform relay: link-agnostic message delivery between clients"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
cloudyfami-portal = "cloudyfami_portal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudyfami_portal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
